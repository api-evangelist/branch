# Branch Insurance - Conceptual GraphQL Schema
# Derived from the Branch Quote to Bind API domain model
# https://docs.v2.api.ourbranch.com/

# ---------------------------------------------------------------------------
# Scalars
# ---------------------------------------------------------------------------

scalar Date
scalar DateTime
scalar Decimal
scalar JSON
scalar Upload

# ---------------------------------------------------------------------------
# Enums
# ---------------------------------------------------------------------------

enum PolicyStatus {
  PENDING
  ACTIVE
  CANCELLED
  EXPIRED
  NON_RENEWED
  RESCINDED
}

enum QuoteStatus {
  DRAFT
  RATED
  OFFERED
  BOUND
  EXPIRED
  DECLINED
  REFERRED
}

enum ProductLine {
  HOME
  AUTO
  RENTERS
  UMBRELLA
  BUNDLE
}

enum CoverageType {
  # Homeowners
  DWELLING
  OTHER_STRUCTURES
  PERSONAL_PROPERTY
  LOSS_OF_USE
  PERSONAL_LIABILITY
  MEDICAL_PAYMENTS
  WATER_BACKUP
  EQUIPMENT_BREAKDOWN
  IDENTITY_FRAUD
  # Auto
  BODILY_INJURY_LIABILITY
  PROPERTY_DAMAGE_LIABILITY
  UNINSURED_MOTORIST_BODILY_INJURY
  UNINSURED_MOTORIST_PROPERTY_DAMAGE
  UNDERINSURED_MOTORIST
  COMPREHENSIVE
  COLLISION
  MEDICAL_PAYMENTS_AUTO
  PERSONAL_INJURY_PROTECTION
  ROADSIDE_ASSISTANCE
  RENTAL_REIMBURSEMENT
  GAP_COVERAGE
  # Renters
  RENTERS_PERSONAL_PROPERTY
  RENTERS_LOSS_OF_USE
  RENTERS_LIABILITY
  RENTERS_MEDICAL_PAYMENTS
  # Umbrella
  EXCESS_LIABILITY
  UMBRELLA_PERSONAL_LIABILITY
}

enum ConstructionType {
  FRAME
  MASONRY
  MASONRY_VENEER
  SUPERIOR
  MANUFACTURED
  MODULAR
}

enum RoofMaterial {
  ASPHALT_SHINGLE
  METAL
  TILE
  SLATE
  WOOD_SHAKE
  FLAT
  OTHER
}

enum ResidenceType {
  SINGLE_FAMILY
  CONDO
  TOWNHOUSE
  DUPLEX
  MOBILE_HOME
  RENTAL
}

enum PaymentMethod {
  CREDIT_CARD
  ACH_BANK_TRANSFER
  ESCROW
  CHECK
}

enum PaymentFrequency {
  MONTHLY
  SEMI_ANNUAL
  ANNUAL
}

enum PaymentStatus {
  PENDING
  PROCESSED
  FAILED
  REFUNDED
  VOIDED
}

enum DocumentType {
  DECLARATIONS_PAGE
  CERTIFICATE_OF_INSURANCE
  POLICY_DOCUMENT
  ID_CARD
  CANCELLATION_NOTICE
  RENEWAL_NOTICE
  ENDORSEMENT_DOCUMENT
  BINDER
  INVOICE
}

enum MaritalStatus {
  SINGLE
  MARRIED
  DIVORCED
  WIDOWED
  DOMESTIC_PARTNER
}

enum OwnershipStatus {
  OWNER
  RENTER
  OTHER
}

enum LicenseStatus {
  VALID
  SUSPENDED
  REVOKED
  EXPIRED
  NONE
}

enum ViolationType {
  SPEEDING
  AT_FAULT_ACCIDENT
  NOT_AT_FAULT_ACCIDENT
  DUI_DWI
  RECKLESS_DRIVING
  DISTRACTED_DRIVING
  FAILURE_TO_STOP
  OTHER_MOVING_VIOLATION
  NON_MOVING_VIOLATION
}

enum ClaimType {
  WIND
  HAIL
  FIRE
  WATER
  THEFT
  LIABILITY
  FLOOD
  EARTHQUAKE
  VANDALISM
  COLLISION_CLAIM
  COMPREHENSIVE_CLAIM
  OTHER
}

enum EndorsementStatus {
  PENDING
  APPROVED
  REJECTED
  APPLIED
}

enum CancellationReason {
  NON_PAYMENT
  INSURED_REQUEST
  UNDERWRITING
  FRAUD
  NON_RENEWAL
}

enum CreditTier {
  PREFERRED_PLUS
  PREFERRED
  STANDARD
  SUBSTANDARD
  DECLINED
}

enum FloodZone {
  A
  AE
  AH
  AO
  AR
  A99
  B
  C
  D
  V
  VE
  X
  UNKNOWN
}

enum PartnerStatus {
  ACTIVE
  SUSPENDED
  PENDING_APPROVAL
}

# ---------------------------------------------------------------------------
# Core Address Type
# ---------------------------------------------------------------------------

type Address {
  line1: String!
  line2: String
  city: String!
  state: String!
  zip: String!
  county: String
  country: String!
  latitude: Decimal
  longitude: Decimal
  standardized: Boolean
}

input AddressInput {
  line1: String!
  line2: String
  city: String!
  state: String!
  zip: String!
  county: String
  country: String
}

# ---------------------------------------------------------------------------
# Partner
# ---------------------------------------------------------------------------

type Partner {
  id: ID!
  name: String!
  slug: String!
  status: PartnerStatus!
  contactEmail: String
  contactPhone: String
  webhookUrl: String
  allowedStates: [String!]!
  allowedProducts: [ProductLine!]!
  apiKeyPrefix: String
  createdAt: DateTime!
  updatedAt: DateTime!
  quotes(filter: QuoteFilter, limit: Int, offset: Int): QuoteConnection!
  policies(filter: PolicyFilter, limit: Int, offset: Int): PolicyConnection!
}

# ---------------------------------------------------------------------------
# Applicant
# ---------------------------------------------------------------------------

type Applicant {
  id: ID!
  firstName: String!
  lastName: String!
  email: String!
  phone: String
  dateOfBirth: Date!
  maritalStatus: MaritalStatus
  ownershipStatus: OwnershipStatus
  mailingAddress: Address
  creditTier: CreditTier
  createdAt: DateTime!
  updatedAt: DateTime!
  quotes: [Quote!]!
  policies: [Policy!]!
}

input ApplicantInput {
  firstName: String!
  lastName: String!
  email: String!
  phone: String
  dateOfBirth: Date!
  maritalStatus: MaritalStatus
  ownershipStatus: OwnershipStatus
  mailingAddress: AddressInput
}

# ---------------------------------------------------------------------------
# Property
# ---------------------------------------------------------------------------

type Property {
  id: ID!
  address: Address!
  residenceType: ResidenceType!
  yearBuilt: Int
  squareFootage: Int
  stories: Int
  constructionType: ConstructionType
  roofAge: Int
  roofMaterial: RoofMaterial
  hasPool: Boolean
  hasTrampoline: Boolean
  hasDogOnPremises: Boolean
  distanceToCoast: Decimal
  distanceToFireStation: Decimal
  floodZone: FloodZone
  protectionClass: Int
  purchasePrice: Decimal
  purchaseDate: Date
}

input PropertyInput {
  address: AddressInput!
  residenceType: ResidenceType!
  yearBuilt: Int
  squareFootage: Int
  stories: Int
  constructionType: ConstructionType
  roofAge: Int
  roofMaterial: RoofMaterial
  hasPool: Boolean
  hasTrampoline: Boolean
  hasDogOnPremises: Boolean
  purchasePrice: Decimal
  purchaseDate: Date
}

# ---------------------------------------------------------------------------
# Vehicle
# ---------------------------------------------------------------------------

type Vehicle {
  id: ID!
  year: Int!
  make: String!
  model: String!
  trim: String
  vin: String
  annualMileage: Int
  garagingAddress: Address
  primaryUse: String
  ownershipType: String
  hasAntiTheft: Boolean
  hasAntiLock: Boolean
  hasAirbags: Boolean
  currentValue: Decimal
}

input VehicleInput {
  year: Int!
  make: String!
  model: String!
  trim: String
  vin: String
  annualMileage: Int
  garagingAddress: AddressInput
  primaryUse: String
  ownershipType: String
  hasAntiTheft: Boolean
  hasAntiLock: Boolean
  hasAirbags: Boolean
}

# ---------------------------------------------------------------------------
# Driver
# ---------------------------------------------------------------------------

type Driver {
  id: ID!
  firstName: String!
  lastName: String!
  dateOfBirth: Date!
  licenseState: String
  licenseStatus: LicenseStatus
  yearsLicensed: Int
  violations: [Violation!]!
  isApplicant: Boolean!
}

input DriverInput {
  firstName: String!
  lastName: String!
  dateOfBirth: Date!
  licenseState: String
  licenseStatus: LicenseStatus
  yearsLicensed: Int
  violations: [ViolationInput!]
  isApplicant: Boolean
}

type Violation {
  type: ViolationType!
  date: Date!
  description: String
}

input ViolationInput {
  type: ViolationType!
  date: Date!
  description: String
}

# ---------------------------------------------------------------------------
# Loss History / Claims
# ---------------------------------------------------------------------------

type LossHistory {
  id: ID!
  claimType: ClaimType!
  claimDate: Date!
  claimAmount: Decimal
  description: String
  atFault: Boolean
  policyNumber: String
  priorCarrier: String
}

input LossHistoryInput {
  claimType: ClaimType!
  claimDate: Date!
  claimAmount: Decimal
  description: String
  atFault: Boolean
  policyNumber: String
  priorCarrier: String
}

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

type Coverage {
  type: CoverageType!
  limit: Decimal
  deductible: Decimal
  premium: Decimal
  isIncluded: Boolean!
  isOptional: Boolean!
  description: String
}

input CoverageInput {
  type: CoverageType!
  limit: Decimal
  deductible: Decimal
  include: Boolean
}

# ---------------------------------------------------------------------------
# Premium
# ---------------------------------------------------------------------------

type Premium {
  annualAmount: Decimal!
  monthlyAmount: Decimal!
  semiAnnualAmount: Decimal!
  basePremium: Decimal!
  fees: Decimal!
  taxes: Decimal!
  discounts: [Discount!]!
  surcharges: [Surcharge!]!
  currency: String!
}

type Discount {
  name: String!
  amount: Decimal!
  percentage: Decimal
  description: String
}

type Surcharge {
  name: String!
  amount: Decimal!
  percentage: Decimal
  description: String
}

# ---------------------------------------------------------------------------
# Quote Types
# ---------------------------------------------------------------------------

interface Quote {
  id: ID!
  status: QuoteStatus!
  productLine: ProductLine!
  applicant: Applicant!
  partner: Partner
  premium: Premium!
  coverages: [Coverage!]!
  effectiveDate: Date!
  expirationDate: Date!
  declineReasons: [String!]
  referralReasons: [String!]
  createdAt: DateTime!
  updatedAt: DateTime!
}

type HomeQuote implements Quote {
  id: ID!
  status: QuoteStatus!
  productLine: ProductLine!
  applicant: Applicant!
  partner: Partner
  premium: Premium!
  coverages: [Coverage!]!
  effectiveDate: Date!
  expirationDate: Date!
  declineReasons: [String!]
  referralReasons: [String!]
  createdAt: DateTime!
  updatedAt: DateTime!
  property: Property!
  lossHistory: [LossHistory!]!
  dwellingValue: Decimal
  replacementCost: Boolean
}

type AutoQuote implements Quote {
  id: ID!
  status: QuoteStatus!
  productLine: ProductLine!
  applicant: Applicant!
  partner: Partner
  premium: Premium!
  coverages: [Coverage!]!
  effectiveDate: Date!
  expirationDate: Date!
  declineReasons: [String!]
  referralReasons: [String!]
  createdAt: DateTime!
  updatedAt: DateTime!
  vehicles: [Vehicle!]!
  drivers: [Driver!]!
  lossHistory: [LossHistory!]!
}

type RentersQuote implements Quote {
  id: ID!
  status: QuoteStatus!
  productLine: ProductLine!
  applicant: Applicant!
  partner: Partner
  premium: Premium!
  coverages: [Coverage!]!
  effectiveDate: Date!
  expirationDate: Date!
  declineReasons: [String!]
  referralReasons: [String!]
  createdAt: DateTime!
  updatedAt: DateTime!
  property: Property!
  monthlyRent: Decimal
}

type UmbrellaQuote implements Quote {
  id: ID!
  status: QuoteStatus!
  productLine: ProductLine!
  applicant: Applicant!
  partner: Partner
  premium: Premium!
  coverages: [Coverage!]!
  effectiveDate: Date!
  expirationDate: Date!
  declineReasons: [String!]
  referralReasons: [String!]
  createdAt: DateTime!
  updatedAt: DateTime!
  umbrellaLimit: Decimal!
  underlyingPolicies: [String!]!
}

type BundleQuote {
  id: ID!
  status: QuoteStatus!
  applicant: Applicant!
  partner: Partner
  homeQuote: HomeQuote
  autoQuote: AutoQuote
  rentersQuote: RentersQuote
  totalPremium: Premium!
  bundleDiscount: Decimal
  effectiveDate: Date!
  expirationDate: Date!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# ---------------------------------------------------------------------------
# Quote Inputs
# ---------------------------------------------------------------------------

input HomeQuoteRequest {
  applicant: ApplicantInput!
  property: PropertyInput!
  lossHistory: [LossHistoryInput!]
  coverages: [CoverageInput!]
  effectiveDate: Date!
  partnerId: ID
}

input AutoQuoteRequest {
  applicant: ApplicantInput!
  vehicles: [VehicleInput!]!
  drivers: [DriverInput!]!
  lossHistory: [LossHistoryInput!]
  coverages: [CoverageInput!]
  effectiveDate: Date!
  partnerId: ID
}

input RentersQuoteRequest {
  applicant: ApplicantInput!
  property: PropertyInput!
  monthlyRent: Decimal
  coverages: [CoverageInput!]
  effectiveDate: Date!
  partnerId: ID
}

input UmbrellaQuoteRequest {
  applicant: ApplicantInput!
  umbrellaLimit: Decimal!
  underlyingPolicies: [String!]!
  effectiveDate: Date!
  partnerId: ID
}

input BundleQuoteRequest {
  home: HomeQuoteRequest
  auto: AutoQuoteRequest
  renters: RentersQuoteRequest
  effectiveDate: Date!
  partnerId: ID
}

input QuoteUpdateInput {
  coverages: [CoverageInput!]
  effectiveDate: Date
  property: PropertyInput
  vehicles: [VehicleInput!]
  drivers: [DriverInput!]
}

input QuoteFilter {
  status: QuoteStatus
  productLine: ProductLine
  applicantEmail: String
  partnerId: ID
  createdAfter: DateTime
  createdBefore: DateTime
  state: String
}

