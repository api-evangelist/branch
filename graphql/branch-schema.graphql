# ---------------------------------------------------------------------------
# Lender / Mortgagee
# ---------------------------------------------------------------------------

type Lender {
  id: ID!
  name: String!
  loanNumber: String
  address: Address!
  escrowBilling: Boolean!
}

input LenderInput {
  name: String!
  loanNumber: String
  address: AddressInput!
  escrowBilling: Boolean
}

# ---------------------------------------------------------------------------
# Payment
# ---------------------------------------------------------------------------

type Payment {
  id: ID!
  policyId: ID!
  amount: Decimal!
  currency: String!
  status: PaymentStatus!
  method: PaymentMethod!
  frequency: PaymentFrequency!
  dueDate: Date!
  paidDate: DateTime
  transactionId: String
  failureReason: String
  createdAt: DateTime!
}

type PaymentMethodRecord {
  id: ID!
  type: PaymentMethod!
  last4: String
  brand: String
  bankName: String
  isDefault: Boolean!
  expiresAt: Date
}

input PaymentMethodInput {
  type: PaymentMethod!
  token: String!
  isDefault: Boolean
}

input PaymentInput {
  policyId: ID!
  amount: Decimal!
  paymentMethodId: ID!
}

input BillingScheduleInput {
  policyId: ID!
  frequency: PaymentFrequency!
  paymentMethodId: ID!
  startDate: Date
}

# ---------------------------------------------------------------------------
# Endorsement
# ---------------------------------------------------------------------------

type Endorsement {
  id: ID!
  policyId: ID!
  status: EndorsementStatus!
  description: String!
  effectiveDate: Date!
  premiumChange: Decimal
  coverageChanges: [Coverage!]!
  requestedAt: DateTime!
  processedAt: DateTime
}

input EndorsementInput {
  description: String!
  effectiveDate: Date!
  coverageChanges: [CoverageInput!]
  propertyChanges: PropertyInput
  vehicleChanges: [VehicleInput!]
  driverChanges: [DriverInput!]
}

# ---------------------------------------------------------------------------
# Document
# ---------------------------------------------------------------------------

type Document {
  id: ID!
  policyId: ID!
  type: DocumentType!
  title: String!
  url: String!
  expiresAt: DateTime
  generatedAt: DateTime!
}

# ---------------------------------------------------------------------------
# Bind Request
# ---------------------------------------------------------------------------

input BindRequest {
  paymentMethod: PaymentMethodInput!
  paymentFrequency: PaymentFrequency!
  lender: LenderInput
  effectiveDate: Date
  agreeToTerms: Boolean!
}

# ---------------------------------------------------------------------------
# Cancellation
# ---------------------------------------------------------------------------

input CancellationInput {
  reason: CancellationReason!
  effectiveDate: Date!
  notes: String
}

type CancellationResult {
  policyId: ID!
  status: PolicyStatus!
  cancellationDate: Date!
  refundAmount: Decimal
  confirmationNumber: String!
}

# ---------------------------------------------------------------------------
# Connection / Pagination Types
# ---------------------------------------------------------------------------

type QuoteConnection {
  edges: [QuoteEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type QuoteEdge {
  cursor: String!
  node: HomeQuote
}

type PolicyConnection {
  edges: [PolicyEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type PolicyEdge {
  cursor: String!
  node: HomePolicy
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

# ---------------------------------------------------------------------------
# Rate / Underwriting Result
# ---------------------------------------------------------------------------

type UnderwritingResult {
  approved: Boolean!
  declineReasons: [String!]
  referralReasons: [String!]
  notes: String
}

# ---------------------------------------------------------------------------
# State Availability
# ---------------------------------------------------------------------------

type StateAvailability {
  state: String!
  stateCode: String!
  availableProducts: [ProductLine!]!
  isAvailable: Boolean!
}

# ---------------------------------------------------------------------------
# Root Query
# ---------------------------------------------------------------------------

type Query {
  # Partner
  getPartner(id: ID!): Partner
  me: Partner

  # Quotes
  getHomeQuote(id: ID!): HomeQuote
  getAutoQuote(id: ID!): AutoQuote
  getRentersQuote(id: ID!): RentersQuote
  getUmbrellaQuote(id: ID!): UmbrellaQuote
  getBundleQuote(id: ID!): BundleQuote
  listQuotes(filter: QuoteFilter, limit: Int, offset: Int): QuoteConnection!

  # Policies
  getHomePolicy(id: ID!): HomePolicy
  getAutoPolicy(id: ID!): AutoPolicy
  getRentersPolicy(id: ID!): RentersPolicy
  getUmbrellaPolicy(id: ID!): UmbrellaPolicy
  getPolicyByNumber(policyNumber: String!): HomePolicy
  listPolicies(filter: PolicyFilter, limit: Int, offset: Int): PolicyConnection!

  # Applicant
  getApplicant(id: ID!): Applicant
  findApplicant(email: String!): Applicant

  # Document
  getDocument(id: ID!): Document
  listDocuments(policyId: ID!): [Document!]!

  # Payment
  getPayment(id: ID!): Payment
  listPayments(policyId: ID!): [Payment!]!
  listPaymentMethods: [PaymentMethodRecord!]!

  # Endorsement
  getEndorsement(id: ID!): Endorsement
  listEndorsements(policyId: ID!): [Endorsement!]!

  # Availability
  checkStateAvailability(state: String!): StateAvailability!
  listAvailableStates: [StateAvailability!]!

  # Rating factors / lookup
  lookupVehicle(vin: String!): Vehicle
  estimateDwellingValue(property: PropertyInput!): Decimal
}

# ---------------------------------------------------------------------------
# Root Mutation
# ---------------------------------------------------------------------------

type Mutation {
  # Quoting
  createHomeQuote(input: HomeQuoteRequest!): HomeQuote!
  createAutoQuote(input: AutoQuoteRequest!): AutoQuote!
  createRentersQuote(input: RentersQuoteRequest!): RentersQuote!
  createUmbrellaQuote(input: UmbrellaQuoteRequest!): UmbrellaQuote!
  createBundleQuote(input: BundleQuoteRequest!): BundleQuote!
  updateQuote(id: ID!, input: QuoteUpdateInput!): HomeQuote!
  refreshQuote(id: ID!): HomeQuote!

  # Binding
  bindHomeQuote(id: ID!, input: BindRequest!): HomePolicy!
  bindAutoQuote(id: ID!, input: BindRequest!): AutoPolicy!
  bindRentersQuote(id: ID!, input: BindRequest!): RentersPolicy!
  bindUmbrellaQuote(id: ID!, input: BindRequest!): UmbrellaPolicy!
  bindBundleQuote(id: ID!, input: BindRequest!): [HomePolicy!]!

  # Payment
  addPaymentMethod(input: PaymentMethodInput!): PaymentMethodRecord!
  removePaymentMethod(id: ID!): Boolean!
  processPayment(input: PaymentInput!): Payment!
  updateBillingSchedule(input: BillingScheduleInput!): Policy!

  # Policy management
  requestEndorsement(policyId: ID!, input: EndorsementInput!): Endorsement!
  cancelPolicy(policyId: ID!, input: CancellationInput!): CancellationResult!

  # Documents
  retrieveDocument(policyId: ID!, type: DocumentType!): Document!

  # Partner / admin
  updatePartnerWebhook(url: String!): Partner!
}

# ---------------------------------------------------------------------------
# Subscriptions
# ---------------------------------------------------------------------------

type Subscription {
  quoteStatusChanged(quoteId: ID!): HomeQuote!
  policyStatusChanged(policyId: ID!): HomePolicy!
  paymentProcessed(policyId: ID!): Payment!
  endorsementStatusChanged(endorsementId: ID!): Endorsement!
}
